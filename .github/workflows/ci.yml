name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

# One job running bin/ci, the whole checklist. No secrets: pull requests from
# forks run the same way. Actions are pinned to commits.
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.20.0"
      - run: bin/ci
